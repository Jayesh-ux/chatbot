<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Catalog Chatbot</title>
<style>
  :root {
    --user-bubble: #2563eb;
    --bot-bubble: #e5e7eb;
    --bg: #f3f4f6;
    --header: #111827;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--header); color: #fff; padding: 14px 20px; font-weight: 600;
    font-size: clamp(16px, 4vw, 18px);
    flex: 0 0 auto;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  #chat {
    flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 70%; padding: 10px 14px; border-radius: var(--radius);
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    font-size: clamp(14px, 3.8vw, 16px);
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
  .msg.bot  { align-self: flex-start; background: var(--bot-bubble); color: #111; }
  .msg .sources { margin-top: 8px; font-size: 0.82em; color: #555;
                  border-top: 1px solid #d1d5db; padding-top: 6px; }
  .msg .sources b { display: block; margin-bottom: 2px; color: #333; }
  .thinking { font-style: italic; color: #6b7280; align-self: flex-start; }
  #input-row {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    background: #fff; border-top: 1px solid #d1d5db; flex: 0 0 auto;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  #query {
    flex: 1; min-width: 0; padding: 12px; border: 1px solid #d1d5db;
    border-radius: 10px; font-size: 16px;  /* 16px prevents iOS zoom */
  }
  #send {
    flex: 0 0 auto; min-height: 44px; padding: 0 20px; border: none;
    border-radius: 10px; background: var(--user-bubble); color: #fff;
    font-size: 16px; cursor: pointer;
  }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }

  /* ---- Responsive: phones ---- */
  @media (max-width: 600px) {
    #chat { padding: 12px; gap: 10px; }
    .msg { max-width: 88%; padding: 9px 12px; }
    #input-row { gap: 8px; padding: 10px 12px; }
    #query { padding: 11px 12px; }
  }
  /* ---- Responsive: small tablets ---- */
  @media (max-width: 900px) and (min-width: 601px) {
    .msg { max-width: 80%; }
  }
  /* ---- Hover state only on pointers (avoid sticky-tap on touch) ---- */
  @media (hover: hover) {
    #send:hover { filter: brightness(1.08); }
  }
</style>
</head>
<body>
<header>Product Catalog Chatbot</header>
<div id="chat"></div>
<div id="input-row">
  <input id="query" placeholder="Ask about products, SKUs, prices..." autocomplete="off" enterkeyhint="send">
  <button id="send" type="button">Send</button>
</div>

<script>
"use strict";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("query");
const sendEl = document.getElementById("send");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSources(div, sources) {
  const wrap = document.createElement("div");
  wrap.className = "sources";
  const label = document.createElement("b");
  label.textContent = "Sources:";
  wrap.appendChild(label);
  wrap.appendChild(document.createTextNode(sources.join(", ")));
  div.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setBusy(busy) {
  sendEl.disabled = busy;
  sendEl.textContent = busy ? "..." : "Send";
}

async function sendQuery() {
  const query = inputEl.value.trim();
  if (!query || sendEl.disabled) return;
  addMsg(query, "user");
  inputEl.value = "";
  const thinking = document.createElement("div");
  thinking.className = "thinking";
  thinking.textContent = "Thinking...";
  chatEl.appendChild(thinking);
  setBusy(true);

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const data = await resp.json();
    thinking.remove();
    if (resp.ok) {
      const bot = addMsg(data.response, "bot");
      if (data.sources && data.sources.length) addSources(bot, data.sources);
    } else {
      addMsg(data.detail || data.error || "Server error", "bot");
    }
  } catch (err) {
    thinking.remove();
    addMsg("Network error: " + err.message, "bot");
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

sendEl.addEventListener("click", sendQuery);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendQuery();
});
</script>
</body>
</html>
