<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalog Chatbot</title>
<style>
  :root {
    --user-bubble: #2563eb;
    --bot-bubble: #e5e7eb;
    --bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    background: #111827; color: #fff; padding: 14px 20px; font-weight: 600;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px;
         line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
  .msg.bot  { align-self: flex-start; background: var(--bot-bubble); color: #111; }
  .msg .sources { margin-top: 8px; font-size: 0.82em; color: #555;
                  border-top: 1px solid #d1d5db; padding-top: 6px; }
  .msg .sources b { display: block; margin-bottom: 2px; color: #333; }
  .thinking { font-style: italic; color: #6b7280; align-self: flex-start; }
  #input-row {
    display: flex; gap: 8px; padding: 14px; background: #fff;
    border-top: 1px solid #d1d5db;
  }
  #query { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db;
           border-radius: 8px; font-size: 1rem; }
  #send { padding: 10px 18px; border: none; border-radius: 8px;
          background: var(--user-bubble); color: #fff; font-size: 1rem;
          cursor: pointer; }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>
<header>Product Catalog Chatbot</header>
<div id="chat"></div>
<div id="input-row">
  <input id="query" placeholder="Ask about products, SKUs, prices..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
"use strict";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("query");
const sendEl = document.getElementById("send");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSources(div, sources) {
  const wrap = document.createElement("div");
  wrap.className = "sources";
  const label = document.createElement("b");
  label.textContent = "Sources:";
  wrap.appendChild(label);
  wrap.appendChild(document.createTextNode(sources.join(", ")));
  div.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setBusy(busy) {
  sendEl.disabled = busy;
  sendEl.textContent = busy ? "..." : "Send";
}

async function sendQuery() {
  const query = inputEl.value.trim();
  if (!query) return;
  addMsg(query, "user");
  inputEl.value = "";
  const thinking = document.createElement("div");
  thinking.className = "thinking";
  thinking.textContent = "Thinking...";
  chatEl.appendChild(thinking);
  setBusy(true);

  try {
    const resp = await fetch("/chatbot/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const data = await resp.json();
    thinking.remove();
    if (resp.ok) {
      const bot = addMsg(data.response, "bot");
      if (data.sources && data.sources.length) addSources(bot, data.sources);
    } else {
      addMsg(data.detail || data.error || "Server error", "bot");
    }
  } catch (err) {
    thinking.remove();
    addMsg("Network error: " + err.message, "bot");
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

sendEl.addEventListener("click", sendQuery);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendQuery();
});
</script>
</body>
</html>
