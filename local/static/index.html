<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalog Chatbot (local)</title>
<style>
  :root{--user:#2563eb;--bot:#e5e7eb;--bg:#f3f4f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;
       background:var(--bg);height:100vh;display:flex;flex-direction:column}
  header{background:#111827;color:#fff;padding:14px 20px;font-weight:600}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:10px 14px;border-radius:12px;line-height:1.5;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bot);color:#111}
  .msg .sources{margin-top:8px;font-size:.82em;color:#555;border-top:1px solid #d1d5db;padding-top:6px}
  .msg .sources b{display:block;color:#333}
  .thinking{font-style:italic;color:#6b7280;align-self:flex-start}
  #row{display:flex;gap:8px;padding:14px;background:#fff;border-top:1px solid #d1d5db}
  #query{flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
  #send{padding:10px 18px;border:none;border-radius:8px;background:var(--user);color:#fff;font-size:1rem;cursor:pointer}
  .hint{color:#9ca3af;font-size:.75rem;padding:0 20px 8px}
</style>
</head>
<body>
<header>Product Catalog Chatbot (local)</header>
<div class="hint">Try: "products under $40" &middot; "SKU RW05-516" &middot; "flashlight" &middot; "coffee"</div>
<div id="chat"></div>
<div id="row">
  <input id="query" placeholder="Ask about products, SKUs, prices..." autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
"use strict";
const chat=document.getElementById("chat"), inp=document.getElementById("query"), btn=document.getElementById("send");
function add(t,w){const d=document.createElement("div");d.className="msg "+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function addSources(d,src){if(!src||!src.length)return;const w=document.createElement("div");w.className="sources";const b=document.createElement("b");b.textContent="Sources:";w.appendChild(b);w.appendChild(document.createTextNode(src.join(", ")));d.appendChild(w);chat.scrollTop=chat.scrollHeight;}
async function send(){
  const q=inp.value.trim();if(!q)return;
  add(q,"user");inp.value="";
  const th=document.createElement("div");th.className="thinking";th.textContent="Searching...";chat.appendChild(th);
  btn.disabled=true;
  try{
    const r=await fetch("/chatbot/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});
    const d=await r.json();th.remove();
    if(r.ok){const b=add(d.response,"bot");addSources(b,d.sources);}
    else add(d.error||d.response||"Server error","bot");
  }catch(e){th.remove();add("Network error: "+e.message,"bot");}
  btn.disabled=false;inp.focus();
}
btn.onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
</script>
</body>
</html>
