<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Catalog Chatbot (local)</title>
<style>
  :root {
    --user-bubble: #2563eb;
    --bot-bubble: #e5e7eb;
    --bg: #f3f4f6;
    --header: #111827;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--header); color: #fff; padding: 14px 20px; font-weight: 600;
    font-size: clamp(16px, 4vw, 18px);
    flex: 0 0 auto;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .hint { color: #9ca3af; font-size: 0.75rem; padding: 0 20px 8px; flex: 0 0 auto; }
  #chat {
    flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 70%; padding: 10px 14px; border-radius: var(--radius);
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    font-size: clamp(14px, 3.8vw, 16px);
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
  .msg.bot  { align-self: flex-start; background: var(--bot-bubble); color: #111; }
  .msg .sources { margin-top: 8px; font-size: 0.82em; color: #555;
                  border-top: 1px solid #d1d5db; padding-top: 6px; }
  .msg .sources b { display: block; margin-bottom: 2px; color: #333; }
  .thinking { font-style: italic; color: #6b7280; align-self: flex-start; }
  #row {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    background: #fff; border-top: 1px solid #d1d5db; flex: 0 0 auto;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  #query {
    flex: 1; min-width: 0; padding: 12px; border: 1px solid #d1d5db;
    border-radius: 10px; font-size: 16px;  /* 16px prevents iOS zoom */
  }
  #send {
    flex: 0 0 auto; min-height: 44px; padding: 0 20px; border: none;
    border-radius: 10px; background: var(--user-bubble); color: #fff;
    font-size: 16px; cursor: pointer;
  }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }

  @media (max-width: 600px) {
    #chat { padding: 12px; gap: 10px; }
    .msg { max-width: 88%; padding: 9px 12px; }
    #row { gap: 8px; padding: 10px 12px; }
    #query { padding: 11px 12px; }
  }
  @media (max-width: 900px) and (min-width: 601px) {
    .msg { max-width: 80%; }
  }
  @media (hover: hover) {
    #send:hover { filter: brightness(1.08); }
  }
</style>
</head>
<body>
<header>Product Catalog Chatbot (local)</header>
<div class="hint">Try: "products under $40" &middot; "SKU RW05-516" &middot; "flashlight" &middot; "coffee"</div>
<div id="chat"></div>
<div id="row">
  <input id="query" placeholder="Ask about products, SKUs, prices..." autocomplete="off" enterkeyhint="send">
  <button id="send" type="button">Send</button>
</div>

<script>
"use strict";
const chat = document.getElementById("chat");
const inp = document.getElementById("query");
const btn = document.getElementById("send");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addSources(div, sources) {
  const wrap = document.createElement("div");
  wrap.className = "sources";
  const label = document.createElement("b");
  label.textContent = "Sources:";
  wrap.appendChild(label);
  wrap.appendChild(document.createTextNode(sources.join(", ")));
  div.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function setBusy(busy) {
  btn.disabled = busy;
  btn.textContent = busy ? "..." : "Send";
}

async function send() {
  const q = inp.value.trim();
  if (!q || btn.disabled) return;
  addMsg(q, "user");
  inp.value = "";
  const thinking = document.createElement("div");
  thinking.className = "thinking";
  thinking.textContent = "Searching...";
  chat.appendChild(thinking);
  setBusy(true);
  try {
    const r = await fetch("/chatbot/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q }),
    });
    const d = await r.json();
    thinking.remove();
    if (r.ok) {
      const bot = addMsg(d.response, "bot");
      if (d.sources && d.sources.length) addSources(bot, d.sources);
    } else {
      addMsg(d.error || d.response || "Server error", "bot");
    }
  } catch (e) {
    thinking.remove();
    addMsg("Network error: " + e.message, "bot");
  } finally {
    setBusy(false);
    inp.focus();
  }
}

btn.onclick = send;
inp.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
