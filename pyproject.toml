[project]
name = "product-catalog-chatbot"
version = "1.0.0"
description = "Product catalog chatbot (RAG) — FastAPI + in-memory hybrid search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "sqlparse>=0.4.4",
]

[tool.vercel]
entrypoint = "api.index:app"
