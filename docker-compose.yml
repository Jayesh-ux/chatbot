# Product Catalog Chatbot stack
# Usage:  docker compose up --build
# UI:     http://localhost/chatbot/
version: "3.9"

services:
  chatbot:
    build: .
    container_name: chatbot
    ports:
      - "80:80"
    environment:
      - CHATBOT_SQL=/data/data.sql
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./chroma_db:/app/chroma_db
      # Mount your real SQL dump read-only. Adjust ./data.sql to your path,
      # or drop the file into this folder as data.sql.
      - ./data.sql:/data/data.sql:ro
      - ./data/sample_data.sql:/app/data/sample_data.sql:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    pull_policy: missing
