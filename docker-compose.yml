# Product Catalog Chatbot stack
# Usage:  docker compose up --build
# UI:     http://localhost/chatbot/
version: "3.9"

services:
  chatbot:
    build: .
    container_name: chatbot
    ports:
      - "80:80"
    environment:
      - CHATBOT_SQL=/data/data.sql
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./chroma_db:/app/chroma_db
      # Your real SQL dump goes in the data/ folder as data.sql
      # (next to sample_data.sql). The whole folder is mounted so the app
      # can fall back to sample_data.sql if the real dump isn't present.
      - ./data:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    pull_policy: missing
